<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>기보 밖의 한 수 — 트레일러</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
      body { margin: 0; background: #0c0b09; color: #eee; font-family: 'IBM Plex Sans KR', sans-serif; }
      #work { position: absolute; left: -99999px; top: 0; width: 3200px; height: 1800px; }
      #out { display: block; width: min(100vw, 1280px); aspect-ratio: 16 / 9; margin: 0 auto; background: #000; }
      #bar { text-align: center; padding: 10px; font-size: 14px; }
      button { font: inherit; padding: 6px 14px; margin: 0 4px; }
    </style>
  </head>
  <body>
    <div id="work"><canvas id="board"></canvas></div>
    <canvas id="out" width="1280" height="720"></canvas>
    <div id="bar"><button id="play">미리 보기</button><button id="render">영상으로 렌더링</button> <span id="status"></span></div>
    <script type="module" src="/src/trailer/trailer.ts"></script>
  </body>
</html>
