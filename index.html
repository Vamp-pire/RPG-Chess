<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>기보 밖의 한 수</title>
    <meta name="theme-color" content="#17130f" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" href="pieces/wp.png" as="image" />
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" />
  </head>
  <body style="margin:0;background:#17130f">
    <div id="boot" style="position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#17130f;color:#e9dcc0;font-family:'Gowun Batang',serif;transition:opacity .3s">
      <img src="pieces/wp.png" alt="" width="72" height="72" style="animation:bootb 1.2s ease-in-out infinite" />
      <div style="font-size:28px;font-weight:700;color:#f0d27a">기보 밖의 한 수</div>
      <div style="font-size:13px;opacity:.7">말을 판 위에 놓는 중…</div>
      <div id="boot-tip" style="font-size:12.5px;opacity:.85;max-width:320px;text-align:center;color:#e8c36a;padding:0 16px"></div>
      <script>(function(){var t=["바로 옆에 붙어서 치면 피해가 2배예요. 적도 마찬가지예요.","붉게 깜빡이는 칸은 적이 다음에 칠 곳이에요.","들풀 섬유를 2개 넣으면 장비 품질이 1 올라가요.","여관 창고에 맡긴 재료는 쓰러져도 잃지 않아요.","기록의 벽에서 직업을 다시 정할 수 있어요.","재빠른 몹은 가끔 두 번 움직여요.","판 가장자리에 서면 옆 지역으로 넘어갈 수 있어요.","상점의 오늘의 특가는 날마다 바뀌어요.","퀸은 공격한 다음 턴에 곁으로 넘어져 와요.","엔딩은 하나가 아니에요."];var e=document.getElementById("boot-tip");if(e)e.textContent="💡 "+t[Math.floor(Math.random()*t.length)];})();</script>
      <style>@keyframes bootb{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}</style>
    </div>
    <div id="app">
      <main id="stage"><canvas id="board"></canvas></main>
      <aside id="side"></aside>
    </div>
    <div id="fade"></div>
    <div id="overlay"></div>
    <div id="toasts"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
